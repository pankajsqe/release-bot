name: Release Bot

on:
  workflow_dispatch:
    inputs:
      project_number:
        description: "GitHub Project number"
        required: true
        type: string

      dry_run:
        description: "Dry run - do not create GitHub issue"
        required: true
        type: boolean
        default: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          # PAT required: needs repo + read:org to search project:rancher/101
          # and to create issues in rancher/observability-e2e
          GH_TOKEN:       ${{ secrets.RANCHER_BOT_TOKEN }}
          ACTOR:          ${{ github.actor }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          DRY_RUN:        ${{ inputs.dry_run }}
        run: python bot.py
